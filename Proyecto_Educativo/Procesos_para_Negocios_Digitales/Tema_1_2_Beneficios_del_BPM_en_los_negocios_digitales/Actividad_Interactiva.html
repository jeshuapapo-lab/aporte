<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Beneficios del BPM en los negocios digitales</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 1.2</small><h1>Beneficios del BPM en los negocios digitales</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué hace verificable un beneficio de BPM?", "options": ["Relacionarlo con un problema y una medida definida", "Nombrar BPM a cualquier cambio", "Comprar una herramienta sin propósito", "Prometer mejora sin línea base"], "answer": 0, "feedback": "El beneficio necesita una relación explícita con resultados observables."}, {"q": "¿Qué permite la visibilidad del proceso?", "options": ["Eliminar toda excepción", "Conocer estado, responsable y esperas", "Garantizar que nunca haya errores", "Sustituir todo diálogo entre áreas"], "answer": 1, "feedback": "La información compartida facilita coordinar decisiones."}, {"q": "Pasar de 48 a 36 horas representa una reducción relativa de…", "options": ["12 %", "75 %", "25 %", "36 %"], "answer": 2, "feedback": "La diferencia de doce se divide para la línea base de cuarenta y ocho."}, {"q": "Subir de 4 % a 9 % equivale a…", "options": ["Cinco por ciento de reducción", "Nueve puntos menos", "Un cambio sin unidad interpretable", "Cinco puntos porcentuales más"], "answer": 3, "feedback": "La diferencia entre porcentajes se expresa en puntos porcentuales."}, {"q": "¿Por qué observar además del promedio?", "options": ["Porque puede ocultar casos con tiempos muy distintos", "Porque el promedio siempre es falso", "Porque no pueden existir excepciones", "Porque elimina la necesidad de datos"], "answer": 0, "feedback": "La distribución ayuda a comprender variabilidad y casos extremos."}, {"q": "¿Qué significa estandarizar criterios?", "options": ["Prohibir cualquier excepción sin resolverla", "Reducir variación evitable con reglas comprensibles", "Eliminar toda capacidad de decisión", "Aplicar un mismo resultado a casos distintos"], "answer": 1, "feedback": "Una estandarización útil contempla variaciones legítimas."}, {"q": "¿Quién debe participar en el diagnóstico?", "options": ["Solo el vendedor de software", "Únicamente personas ajenas al proceso", "Quienes ejecutan y reciben el trabajo, además de responsables", "Nadie para evitar opiniones"], "answer": 2, "feedback": "La experiencia operacional revela excepciones y trabajo oculto."}, {"q": "¿Qué no prueba una mejora posterior al proyecto?", "options": ["Que existe un resultado observado", "Que puede compararse con la base", "Que conviene revisar condiciones", "Que el proyecto sea por sí solo su causa"], "answer": 3, "feedback": "La atribución causal exige examinar otros cambios y evidencia pertinente."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
