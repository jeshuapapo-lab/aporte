<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Herramientas digitales para modelado de procesos</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 3.3</small><h1>Herramientas digitales para modelado de procesos</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe definirse antes de elegir un modelador?", "options": ["Propósito, usuarios y requisitos", "La herramienta más anunciada", "La gratuidad eterna de cualquier plan", "La cantidad máxima de iconos"], "answer": 0, "feedback": "La selección depende del trabajo que debe apoyar."}, {"q": "¿Qué limitación tiene entregar solo una imagen?", "options": ["Garantiza ejecutar el proceso", "Puede perderse la estructura editable del modelo", "Conserva siempre todas las condiciones formales", "Resuelve automáticamente versiones"], "answer": 1, "feedback": "Visualización y estructura editable son cosas distintas."}, {"q": "¿Qué archivo puede conservar elementos y relaciones BPMN?", "options": ["Solo una captura JPEG", "Un audio sin metadatos del modelo", "XML conforme al estándar BPMN", "Una fotografía del monitor"], "answer": 2, "feedback": "El intercambio estructurado necesita más que una vista rasterizada."}, {"q": "¿Por qué debe probarse la importación?", "options": ["Porque el estándar garantiza idéntica apariencia siempre", "Porque todas las funciones son equivalentes", "Porque importar elimina las condiciones", "Por posibles diferencias y extensiones entre herramientas"], "answer": 3, "feedback": "La interoperabilidad debe comprobarse con el modelo concreto."}, {"q": "¿Qué necesita una especificación ejecutable?", "options": ["Reglas y datos suficientes para el motor elegido", "Solo una imagen con flechas", "Únicamente una lista de participantes", "Un archivo grande sin estructura"], "answer": 0, "feedback": "La ejecución exige detalle y compatibilidad adicionales."}, {"q": "¿Qué debe revisarse respecto del costo?", "options": ["Suponer que todo será gratuito para siempre", "Las funciones disponibles en la versión y plan reales", "Solo el precio de un anuncio antiguo", "Ignorar condiciones de almacenamiento"], "answer": 1, "feedback": "Funciones y licencias pueden variar y requieren verificación."}, {"q": "¿Qué no resuelve por sí solo un enlace compartido?", "options": ["La posibilidad de acceder si hay permisos", "La existencia de una dirección de recurso", "Aprobación de cambios y control de versiones", "La necesidad de revisar quién lo usa"], "answer": 2, "feedback": "Colaborar requiere reglas, no solo acceso técnico."}, {"q": "¿Qué datos son apropiados para una prueba no autorizada en un servicio externo?", "options": ["Datos personales reales de clientes", "Contraseñas de producción", "Documentos internos sin permiso", "Datos ficticios sin información confidencial"], "answer": 3, "feedback": "La prueba no debe exponer información que no se autorizó compartir."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
