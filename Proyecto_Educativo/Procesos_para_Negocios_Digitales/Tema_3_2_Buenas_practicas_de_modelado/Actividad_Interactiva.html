<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Buenas prácticas de modelado</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 3.2</small><h1>Buenas prácticas de modelado</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué figura representa una actividad BPMN?", "options": ["Rectángulo con esquinas redondeadas", "Círculo de evento", "Rombo de pasarela", "Flecha de mensaje"], "answer": 0, "feedback": "Las formas tienen significado y no deben intercambiarse por apariencia."}, {"q": "¿Qué nombre describe mejor una actividad?", "options": ["Gestión", "Verificar solicitud", "Departamento técnico", "Solicitud completa"], "answer": 1, "feedback": "Verbo y objeto expresan trabajo de forma clara."}, {"q": "¿Qué pasarela corresponde a elegir completa o incompleta?", "options": ["Paralela de apertura de todas las ramas", "Un evento final por sí solo", "Exclusiva", "Un carril sin condición"], "answer": 2, "feedback": "Se selecciona una alternativa según la condición."}, {"q": "¿Qué riesgo tiene reunir alternativas con una unión paralela?", "options": ["Seleccionar automáticamente la condición correcta", "Eliminar toda espera", "Convertir mensajes en tareas", "Esperar una rama que nunca se activó"], "answer": 3, "feedback": "La sincronización paralela no corresponde a rutas mutuamente excluyentes."}, {"q": "¿Qué conecta un flujo de secuencia?", "options": ["Elementos dentro de un mismo pool", "Participantes de pools distintos", "Solo dos documentos", "Cualquier sistema externo por definición"], "answer": 0, "feedback": "La secuencia describe control dentro del participante."}, {"q": "¿Qué representa un flujo de mensaje?", "options": ["Siempre orden interno de tareas", "Comunicación entre participantes distintos", "Una unión de ramas paralelas", "Un reemplazo del evento final"], "answer": 1, "feedback": "El mensaje tiene un significado distinto de la secuencia."}, {"q": "¿Qué debería comprobar una revisión de comportamiento?", "options": ["Únicamente los colores del dibujo", "Solo que el archivo pese poco", "Casos que empiezan, avanzan y terminan sin esperas imposibles", "El número máximo de símbolos"], "answer": 2, "feedback": "La revisión debe recorrer escenarios y sus condiciones."}, {"q": "¿Qué no garantiza una validación sintáctica?", "options": ["Que ciertos errores formales puedan detectarse", "Que existan reglas de la notación", "Que deba revisarse el comportamiento", "Que el modelo represente correctamente el negocio"], "answer": 3, "feedback": "Corrección formal y adecuación al negocio son verificaciones diferentes."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
