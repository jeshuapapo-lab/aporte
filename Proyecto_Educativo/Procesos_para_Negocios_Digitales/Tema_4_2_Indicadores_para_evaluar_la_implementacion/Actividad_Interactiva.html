<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Indicadores para evaluar la implementación</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 4.2</small><h1>Indicadores para evaluar la implementación</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué convierte una medida en KPI?", "options": ["Su relación seleccionada con un objetivo relevante", "Que aparezca en un tablero de colores", "Que sea fácil de contar aunque no importe", "Que tenga un nombre en inglés"], "answer": 0, "feedback": "La importancia proviene de la decisión y el objetivo que apoya."}, {"q": "18 respuestas dentro de plazo de 20 evaluables equivalen a…", "options": ["18 %", "90 %", "95 %", "9 %"], "answer": 1, "feedback": "La tasa usa dieciocho dividido para veinte y multiplicado por cien."}, {"q": "Cuatro correcciones entre 50 casos completados equivalen a…", "options": ["4 %", "12,5 %", "8 %", "46 %"], "answer": 2, "feedback": "La fórmula requiere conservar el denominador del grupo definido."}, {"q": "¿Qué debe precisar una medida de tiempo?", "options": ["Solo el promedio final", "Únicamente el nombre del sistema", "La meta sin unidad", "Inicio, fin y calendario de medición"], "answer": 3, "feedback": "Sin eventos y calendario el tiempo puede significar cosas distintas."}, {"q": "¿Qué debe hacerse con casos abiertos?", "options": ["Aplicar una regla explícita y revisar si su plazo ya es evaluable", "Excluirlos siempre aunque estén vencidos", "Contarlos siempre como resueltos", "Mezclarlos sin conocer fechas"], "answer": 0, "feedback": "El tratamiento afecta el denominador y puede sesgar resultados."}, {"q": "¿Qué riesgo tiene premiar solo cierres rápidos?", "options": ["Garantizar calidad en todos los casos", "Cerrar sin resolver y aumentar reaperturas", "Eliminar toda variación de demanda", "Hacer innecesarias medidas de calidad"], "answer": 1, "feedback": "Los incentivos deben revisarse con medidas de equilibrio."}, {"q": "¿Qué debe acompañar un umbral de alerta?", "options": ["Solo una celda roja sin explicación", "La eliminación de datos adversos", "Responsable y acción de revisión", "Una meta universal inventada"], "answer": 2, "feedback": "La medición sirve para actuar con responsabilidades claras."}, {"q": "¿Qué puede romper la comparabilidad de períodos?", "options": ["Conservar eventos de inicio y fin", "Documentar las exclusiones", "Mantener el origen del dato", "Cambiar definición o mezcla de casos sin explicarlo"], "answer": 3, "feedback": "Las condiciones y definiciones deben considerarse al interpretar variaciones."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
