<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Fases del ciclo de vida del BPM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 2.2</small><h1>Fases del ciclo de vida del BPM</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe producir una fase para orientar el avance?", "options": ["Evidencia útil para una decisión", "Solo una fecha en el calendario", "Una reunión sin registro", "Un nombre de herramienta"], "answer": 0, "feedback": "Los entregables justifican decisiones y no solo cumplimiento de agenda."}, {"q": "¿Qué relación debe conservar el rediseño?", "options": ["Solo proveedor y licencia", "Problema, causa investigada, cambio y medida esperada", "Únicamente apariencia del diagrama", "Una solución sin hipótesis"], "answer": 1, "feedback": "La trazabilidad ayuda a comprobar que se atiende el problema correcto."}, {"q": "¿Qué revela el caso sobre la demora?", "options": ["Toda la demora es trabajo manual de aprobación", "La herramienta ya resolvió el problema", "Predomina la espera por datos incompletos", "No es posible definir una causa"], "answer": 2, "feedback": "La solución debe responder a la evidencia y no a la suposición inicial."}, {"q": "¿Qué se necesita antes de ampliar un piloto?", "options": ["Solo una demostración ideal", "La compra completa de licencias", "Un anuncio de éxito anticipado", "Resultados y criterios de aceptación cumplidos"], "answer": 3, "feedback": "La ampliación requiere comprobar funcionamiento y resultado."}, {"q": "¿Instalar una herramienta equivale a aceptar el proceso?", "options": ["No, deben probarse trabajo, reglas y excepciones", "Sí, si se pagó la licencia", "Sí, si existe un manual extenso", "Sí, si el nombre incluye BPM"], "answer": 0, "feedback": "La aceptación se refiere a capacidad operacional, no a instalación."}, {"q": "¿Qué conviene hacer si los resultados contradicen la hipótesis?", "options": ["Ampliar sin cambios para recuperar inversión", "Revisar el análisis y la alternativa", "Eliminar el indicador desfavorable", "Dar por cerrada toda revisión"], "answer": 1, "feedback": "La retroalimentación permite corregir decisiones."}, {"q": "¿Qué diferencia proyecto y proceso?", "options": ["Ambos terminan siempre el mismo día", "El proceso solo existe durante reuniones", "El proyecto puede cerrar entregables mientras el proceso sigue operando", "Un proyecto no necesita responsables"], "answer": 2, "feedback": "La operación y la mejora continúan más allá de un proyecto concreto."}, {"q": "¿Qué preserva contexto entre fases y equipos?", "options": ["Una imagen sin fecha ni propósito", "La eliminación de hipótesis anteriores", "Un archivo privado que nadie conoce", "Versiones, decisiones y evidencias registradas"], "answer": 3, "feedback": "La trazabilidad reduce pérdida de conocimiento y decisiones inconsistentes."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
