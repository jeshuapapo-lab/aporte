<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Ciclo de vida general del BPM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 1.4</small><h1>Ciclo de vida general del BPM</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué establece la identificación inicial?", "options": ["Propósito, límites y prioridad del proceso", "La compra automática de software", "El cierre definitivo de cualquier cambio", "La eliminación del responsable"], "answer": 0, "feedback": "La delimitación hace investigable y gestionable el alcance."}, {"q": "¿Qué busca el descubrimiento?", "options": ["Solo cómo debería funcionar según el manual", "Cómo funciona realmente el proceso", "Únicamente la nueva plataforma", "La solución antes de observar casos"], "answer": 1, "feedback": "Se recogen perspectivas y evidencia de la operación actual."}, {"q": "¿Qué distingue análisis de rediseño?", "options": ["Son necesariamente el mismo documento", "Analizar es comprar y rediseñar es vender", "Analizar comprende problemas; rediseñar propone alternativas de cambio", "Rediseñar impide revisar causas"], "answer": 2, "feedback": "Las actividades se relacionan, pero tienen propósitos distintos."}, {"q": "¿Qué incluye implementar además de tecnología?", "options": ["Solo publicar un diagrama", "Únicamente cambiar un logotipo", "Eliminar cualquier prueba de aceptación", "Roles, acuerdos, capacitación y controles"], "answer": 3, "feedback": "El cambio debe poder ejecutarse en la organización."}, {"q": "¿Qué función cumple el monitoreo?", "options": ["Comparar desempeño y orientar ajustes", "Dar por cerrado todo proceso para siempre", "Contar diagramas como único resultado", "Sustituir definiciones de datos"], "answer": 0, "feedback": "El seguimiento alimenta decisiones de mejora."}, {"q": "¿Por qué el ciclo es iterativo?", "options": ["Porque nunca puede implementarse nada", "Porque nueva evidencia puede exigir revisar fases anteriores", "Porque no existen objetivos", "Porque todas las fases deben repetirse sin motivo"], "answer": 1, "feedback": "Las revisiones responden a resultados y cambios relevantes."}, {"q": "¿Qué justificaría volver al análisis en el caso?", "options": ["Que se haya publicado el diagrama", "Que exista una presentación", "Que las excepciones sigan quedando sin responsable", "Que ya se haya celebrado la capacitación"], "answer": 2, "feedback": "Los problemas persistentes requieren comprender condiciones y causas."}, {"q": "¿Qué evita confundir resultado del proyecto con resultado del proceso?", "options": ["Contar solo archivos producidos", "Medir únicamente horas de reunión", "Suponer que un plan garantiza ejecución", "Medir desempeño operativo además de entregables"], "answer": 3, "feedback": "Tener documentos o sesiones no prueba que el servicio funcione mejor."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
