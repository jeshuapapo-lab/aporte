<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Generalidades del BPM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 1.1</small><h1>Generalidades del BPM</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué caracteriza a un proceso?", "options": ["Transformar entradas en resultados mediante actividades relacionadas", "Ser siempre una tarea de un departamento", "Existir solo si está automatizado", "Consistir únicamente en una lista de cargos"], "answer": 0, "feedback": "El propósito y la transformación delimitan el proceso."}, {"q": "¿Qué representa un evento?", "options": ["Un cargo jerárquico", "Algo que ocurre y afecta el recorrido", "Una licencia de software", "Cualquier instrucción de trabajo por definición"], "answer": 1, "feedback": "Un evento, como recibir una solicitud, se distingue del trabajo realizado."}, {"q": "¿Qué expresa un flujo?", "options": ["Solo una persona responsable", "El costo de una herramienta", "La relación u orden entre elementos", "La certificación del negocio"], "answer": 2, "feedback": "El flujo ayuda a comprender cómo se conectan los elementos."}, {"q": "¿Qué es BPM?", "options": ["Una única notación gráfica", "Un producto comercial específico", "Una tarea aislada de programación", "Una disciplina de gestión y mejora de procesos"], "answer": 3, "feedback": "BPM requiere gestión continua y no se reduce a una herramienta."}, {"q": "¿Qué es BPMN?", "options": ["Una notación para modelar procesos", "Un sinónimo exacto de toda la disciplina BPM", "Un indicador financiero", "Una garantía de automatización"], "answer": 0, "feedback": "La notación representa; no sustituye la gestión del proceso."}, {"q": "Dos horas de trabajo y tres días hasta responder indican…", "options": ["Que el proceso duró exactamente dos horas", "Que existen tiempos transcurridos adicionales como esperas", "Que no puede medirse", "Que necesariamente se trabajó tres días completos"], "answer": 1, "feedback": "Trabajo y tiempo de ciclo no son la misma medida."}, {"q": "¿Qué aporta un responsable del proceso?", "options": ["Eliminar toda función de las áreas", "Garantizar éxito sin indicadores", "Coordinación del resultado de extremo a extremo", "Sustituir a todos los participantes"], "answer": 2, "feedback": "El responsable coordina el desempeño global y las mejoras."}, {"q": "¿Qué debe hacerse antes de automatizar un recorrido problemático?", "options": ["Digitalizar todos sus pasos sin análisis", "Comprar primero la plataforma más grande", "Eliminar la medición para avanzar más rápido", "Comprenderlo y revisar sus fallos y propósito"], "answer": 3, "feedback": "La automatización puede ampliar problemas que no se comprendieron."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
