<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Rol del BPM en la mejora continua</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 2.3</small><h1>Rol del BPM en la mejora continua</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe conectar una hipótesis de mejora?", "options": ["Cambio, mecanismo y resultado esperado", "Solo una meta sin intervención", "Una licencia con su logotipo", "Una conclusión decidida antes de medir"], "answer": 0, "feedback": "La hipótesis necesita una relación comprobable."}, {"q": "De 20 % a 10 % hay una reducción de…", "options": ["Diez por ciento relativo", "Diez puntos porcentuales", "Cincuenta puntos porcentuales", "Veinte puntos porcentuales"], "answer": 1, "feedback": "La diferencia directa entre tasas se expresa en puntos porcentuales."}, {"q": "La reducción relativa de 20 % a 10 % es…", "options": ["10 %", "100 %", "50 %", "Dos por ciento"], "answer": 2, "feedback": "La disminución de diez se divide para el valor inicial de veinte."}, {"q": "¿Qué función tiene una medida de equilibrio?", "options": ["Sustituir toda medida principal", "Garantizar que el cambio tendrá éxito", "Eliminar casos difíciles", "Detectar efectos secundarios de una mejora"], "answer": 3, "feedback": "Permite revisar consecuencias en otras dimensiones."}, {"q": "¿Qué puede falsear una comparación?", "options": ["Excluir casos complejos en el período posterior", "Conservar las definiciones del indicador", "Registrar condiciones y fechas", "Revisar casos abandonados"], "answer": 0, "feedback": "Cambiar la población puede producir una mejora aparente."}, {"q": "¿Qué debe hacerse si el cambio no mejora el resultado?", "options": ["Eliminar la evidencia desfavorable", "Registrar aprendizaje y revisar o descartar la hipótesis", "Declarar éxito por haber probado", "Imponerlo sin más revisión"], "answer": 1, "feedback": "La prueba debe permitir aprender, incluso si refuta la idea."}, {"q": "¿Qué acompaña estandarizar una mejora?", "options": ["Guardar la idea sin comunicarla", "Suprimir al responsable del proceso", "Actualizar reglas, formación y revisión futura", "Dejar todas las versiones vigentes a la vez"], "answer": 2, "feedback": "La operación necesita acuerdos coherentes con el cambio aceptado."}, {"q": "¿Cómo se relaciona el ciclo de mejora con BPM?", "options": ["Reemplaza toda delimitación", "Elimina el monitoreo", "Impide revisar procesos existentes", "Lo complementa dentro de una gestión con alcance y responsables"], "answer": 3, "feedback": "La revisión iterativa necesita un proceso y una gestión que sostengan el aprendizaje."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
