<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Evaluación y selección de procesos a mejorar</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 4.3</small><h1>Evaluación y selección de procesos a mejorar</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Por qué priorizar procesos?", "options": ["Porque las oportunidades pueden superar la capacidad disponible", "Porque solo debe mejorarse lo más visible", "Porque toda mejora tiene igual efecto", "Para evitar reunir evidencia"], "answer": 0, "feedback": "La selección asigna recursos a un alcance justificable."}, {"q": "¿Qué debe acompañar una puntuación?", "options": ["Solo una impresión presentada como exacta", "Una escala definida y evidencia pertinente", "El nombre del área favorita", "Un valor sin explicación"], "answer": 1, "feedback": "Los números deben poder interpretarse y discutirse."}, {"q": "¿Cuánto deben sumar pesos expresados como proporciones?", "options": ["Cinco por cada criterio", "Cero", "Uno", "El número de procesos"], "answer": 2, "feedback": "La ponderación consistente distribuye la totalidad de la importancia."}, {"q": "Con pesos 0,5; 0,3; 0,2 y valoraciones 5; 2; 4 resulta…", "options": ["11", "3,6", "5,5", "3,9"], "answer": 3, "feedback": "La suma ponderada es 2,5 más 0,6 más 0,8."}, {"q": "Con los mismos pesos y valoraciones 3; 5; 3 resulta…", "options": ["3,6", "3,9", "11", "4,8"], "answer": 0, "feedback": "La suma ponderada es 1,5 más 1,5 más 0,6."}, {"q": "¿Qué explora un análisis de sensibilidad?", "options": ["Solo el color de la matriz", "Cómo cambia la decisión al variar supuestos o pesos", "La cantidad de filas sin fórmulas", "Una garantía de prioridad permanente"], "answer": 1, "feedback": "La sensibilidad muestra dependencia de juicios y condiciones."}, {"q": "¿Qué puede requerir atención fuera del ranking de beneficios?", "options": ["Solo una preferencia sin explicar", "La apariencia del informe", "Una obligación crítica o restricción relevante", "La antigüedad del nombre del área"], "answer": 2, "feedback": "Las restricciones pueden prevalecer sobre una clasificación simplificada."}, {"q": "¿Qué debe hacerse cuando falta evidencia?", "options": ["Inventar una cifra precisa", "Asignar siempre el máximo", "Eliminar el proceso sin revisar", "Registrar incertidumbre y plan para obtener datos"], "answer": 3, "feedback": "La incertidumbre debe ser visible para no simular certeza."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
