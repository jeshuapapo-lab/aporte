<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Componentes clave del BPM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 2.1</small><h1>Componentes clave del BPM</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué aporta el modelado?", "options": ["Una representación explícita del funcionamiento y sus reglas", "La ejecución automática de cualquier dibujo", "Una venta garantizada", "La eliminación del conocimiento operativo"], "answer": 0, "feedback": "La representación necesita propósito, versión y validación."}, {"q": "¿Qué requiere la ejecución?", "options": ["Solo una imagen estática", "Asignaciones, estados y atención de excepciones", "Únicamente el título del modelo", "Un tablero sin trabajo real"], "answer": 1, "feedback": "Ejecutar implica realizar y coordinar el trabajo."}, {"q": "¿Qué defecto afecta el tablero del caso?", "options": ["Incluye una definición de tiempo", "Tiene un responsable de datos", "Omite solicitudes telefónicas", "Conserva identificadores de casos"], "answer": 2, "feedback": "La omisión altera el alcance y puede sesgar resultados."}, {"q": "¿Qué conecta la optimización con la ejecución?", "options": ["Una propuesta archivada sin responsable", "Una cifra favorable aislada", "Una nueva versión que nadie utiliza", "Cambios aprobados, aplicados y comprobados"], "answer": 3, "feedback": "La mejora debe trasladarse a la operación y evaluarse."}, {"q": "¿Qué describe gobierno de procesos?", "options": ["Responsabilidades y reglas para decisiones y cambios", "Solo administración del servidor", "El color de cada actividad", "La cantidad de reuniones"], "answer": 0, "feedback": "El gobierno define autoridad, coordinación y control de versiones."}, {"q": "¿Todo diagrama BPMN es directamente ejecutable?", "options": ["Sí, basta con guardar una imagen", "No, puede necesitar datos y reglas adicionales", "Sí, cualquier flecha contiene toda la lógica", "No puede existir ejecución digital de procesos"], "answer": 1, "feedback": "El propósito de comunicación no exige la misma especificación que automatizar."}, {"q": "¿Qué hace auditable un indicador?", "options": ["Una cifra sin denominador", "Una captura aislada sin período", "Definición, origen de datos y trazabilidad", "Un total que excluye casos incómodos"], "answer": 2, "feedback": "La evidencia debe poder relacionarse con su definición y sus registros."}, {"q": "¿Qué debe revisarse después de cambiar una regla?", "options": ["Solo el anuncio del proyecto", "Únicamente el nombre de la aplicación", "La eliminación del historial", "Consistencia de modelos, operación y medidas"], "answer": 3, "feedback": "Los componentes deben seguir describiendo y midiendo el mismo proceso."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
