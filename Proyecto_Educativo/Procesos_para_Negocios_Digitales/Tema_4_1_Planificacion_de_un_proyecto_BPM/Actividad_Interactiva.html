<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Planificación de un proyecto BPM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 4.1</small><h1>Planificación de un proyecto BPM</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe explicar el alcance?", "options": ["Qué se incluye y qué queda fuera", "Solo el nombre del proveedor", "Una promesa de cambiar toda la empresa", "Únicamente la fecha de cierre"], "answer": 0, "feedback": "Los límites permiten planificar y evaluar lo comprometido."}, {"q": "¿Qué diferencia dueño del proceso y responsable del proyecto?", "options": ["Son necesariamente el mismo cargo en toda empresa", "Uno sostiene la operación; el otro coordina la intervención temporal", "El dueño solo compra tecnología", "El proyecto no necesita coordinación"], "answer": 1, "feedback": "Pueden coincidir en una persona, pero sus funciones no son equivalentes."}, {"q": "¿Qué condiciona un cronograma realista?", "options": ["Suponer dedicación total sin acuerdo", "La fecha del anuncio comercial", "Dependencias y disponibilidad de participantes", "Solo la duración de instalación"], "answer": 2, "feedback": "La capacidad disponible debe corresponder al trabajo planificado."}, {"q": "¿Qué conviene validar antes del diagnóstico?", "options": ["La compra completa del sistema", "La celebración del cierre", "Solo el logotipo del proyecto", "La descripción y evidencia del estado actual"], "answer": 3, "feedback": "El diagnóstico necesita una base confiable."}, {"q": "¿Qué debe contener un riesgo gestionable?", "options": ["Señal, responsable y respuesta", "Solo una frase genérica de preocupación", "Una garantía de que nunca ocurrirá", "Un número sin interpretación"], "answer": 0, "feedback": "El registro debe orientar acciones concretas."}, {"q": "¿Qué es un criterio de aceptación?", "options": ["Una opinión que nunca puede comprobarse", "Condición observable para aprobar un entregable o resultado", "El entusiasmo de la reunión", "La cantidad de archivos guardados"], "answer": 1, "feedback": "La aceptación necesita evidencia definida previamente."}, {"q": "¿Qué evita usar clientes como probadores involuntarios?", "options": ["Lanzar sin revisar excepciones", "Ocultar todos los incidentes", "Preparación, pruebas y transición controlada", "Cambiar producción sin responsable"], "answer": 2, "feedback": "La puesta en marcha debe cuidar continuidad y servicio."}, {"q": "¿Qué debe ocurrir al cerrar el proyecto?", "options": ["Eliminar indicadores y modelos", "Suponer que el proceso ya no cambiará", "Dejar toda responsabilidad sin asignar", "Transferir seguimiento, soporte y conocimiento"], "answer": 3, "feedback": "El proceso continúa operando y requiere gestión posterior."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
