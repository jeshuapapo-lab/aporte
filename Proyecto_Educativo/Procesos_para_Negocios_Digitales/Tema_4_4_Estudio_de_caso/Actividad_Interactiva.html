<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Estudio de caso</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 4.4</small><h1>Estudio de caso</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Cuál es el alcance del proceso del caso?", "options": ["Desde recibir la solicitud hasta comunicar una respuesta útil", "Solo instalar un sistema", "Desde contratar al equipo hasta cerrar la empresa", "Únicamente pulsar enviar"], "answer": 0, "feedback": "Los límites deben corresponder al resultado definido para el destinatario."}, {"q": "80 casos de 30 horas y 20 de 80 dan promedio de…", "options": ["55 horas", "40 horas", "30 horas", "80 horas"], "answer": 1, "feedback": "La media ponderada es (80×30+20×80)/100."}, {"q": "95 casos de 20 horas y cinco de 100 dan promedio de…", "options": ["60 horas", "20 horas", "24 horas", "95 horas"], "answer": 2, "feedback": "La media ponderada es (95×20+5×100)/100."}, {"q": "El promedio de 40 a 24 horas baja relativamente…", "options": ["16 %", "24 %", "60 %", "40 %"], "answer": 3, "feedback": "La disminución de dieciséis se divide para cuarenta."}, {"q": "La corrección de 12 % a 5 % disminuye…", "options": ["Siete puntos porcentuales", "Siete por ciento relativo", "Doce puntos porcentuales", "Cincuenta puntos porcentuales"], "answer": 0, "feedback": "La diferencia directa entre tasas es siete puntos porcentuales."}, {"q": "¿Qué cumplimiento de 48 horas tiene el período futuro simulado?", "options": ["100 %", "95 %", "80 %", "24 %"], "answer": 1, "feedback": "Noventa y cinco casos duran veinte horas y cinco superan el plazo."}, {"q": "¿Qué demuestra que el promedio no cuenta toda la historia?", "options": ["Que todos los casos futuros son iguales", "Que no existen datos de tiempo", "Cinco casos futuros llegan a cien horas", "Que la media es imposible de calcular"], "answer": 2, "feedback": "Las excepciones permanecen relevantes aunque mejore el resultado agregado."}, {"q": "¿Qué límite debe declararse?", "options": ["La simulación garantiza éxito universal", "Los KPI eliminan toda incertidumbre", "El diagrama confirma cualquier hipótesis", "Los datos simulados no prueban causalidad en una empresa real"], "answer": 3, "feedback": "La evidencia del ejercicio permite practicar, no atribuir resultados reales."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
