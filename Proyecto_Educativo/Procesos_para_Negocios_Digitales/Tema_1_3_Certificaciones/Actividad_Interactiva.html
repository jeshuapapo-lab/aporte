<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Certificaciones</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>PROCESOS PARA NEGOCIOS DIGITALES · TEMA 1.3</small><h1>Certificaciones</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué demuestra un certificado de asistencia?", "options": ["Participación bajo las condiciones del curso", "Certificación automática de competencias profesionales", "Certificación de toda la empresa", "Garantía de empleo"], "answer": 0, "feedback": "La asistencia tiene un alcance distinto de una evaluación profesional."}, {"q": "¿Qué debe identificarse en una credencial?", "options": ["Solo el diseño del diploma", "Emisor, objeto, alcance y criterios", "Únicamente la duración del video", "El número de anuncios del curso"], "answer": 1, "feedback": "La utilidad depende de qué certifica y con qué evidencia."}, {"q": "¿Dónde se comprueban requisitos actuales de CBPP?", "options": ["En una cifra de experiencia inventada", "En el logotipo de un curso no relacionado", "En la fuente oficial del esquema de ABPMP", "Solo en el relato de un compañero"], "answer": 2, "feedback": "Los requisitos pueden cambiar y deben verificarse en su origen."}, {"q": "¿Qué acredita principalmente una credencial de una herramienta?", "options": ["Gestión integral de todos los procesos por definición", "Certificación automática de la empresa", "Autorización legal universal", "Competencia dentro del alcance de esa herramienta o esquema"], "answer": 3, "feedback": "El alcance específico no debe ampliarse sin evidencia."}, {"q": "¿A quién pertenece una certificación profesional individual?", "options": ["A la persona que cumple su esquema", "A toda organización donde trabaje", "A todos sus clientes", "A cualquier integrante del departamento"], "answer": 0, "feedback": "La credencial individual no certifica automáticamente a otras personas."}, {"q": "¿Qué anuncio respeta el caso?", "options": ["La empresa está certificada internacionalmente en BPM", "Una analista completó el curso indicado", "Todos sus proyectos tienen éxito garantizado", "El curso equivale a cualquier examen profesional"], "answer": 1, "feedback": "La afirmación debe corresponder a la evidencia real."}, {"q": "¿Qué debe revisarse además del examen?", "options": ["Solo el color del sello", "La promesa de empleo garantizado", "Vigencia, renovación, costos y requisitos pertinentes", "La cantidad de seguidores del instructor"], "answer": 2, "feedback": "La decisión requiere comprender el ciclo completo de la credencial."}, {"q": "¿Qué no garantiza por sí sola una certificación?", "options": ["Que existe un esquema con criterios", "Que puede verificarse su alcance", "Que conviene seguir actualizándose", "El empleo o el éxito de todos los proyectos"], "answer": 3, "feedback": "La práctica y los resultados dependen de más factores que una credencial."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
