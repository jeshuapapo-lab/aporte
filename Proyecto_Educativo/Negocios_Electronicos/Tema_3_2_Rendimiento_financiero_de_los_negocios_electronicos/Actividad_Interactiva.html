<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Rendimiento financiero de los negocios electrónicos</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 3.2</small><h1>Rendimiento financiero de los negocios electrónicos</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "Precio 20 y costo variable 12 producen contribución unitaria de…", "options": ["8 dólares", "32 dólares", "12 dólares", "20 dólares"], "answer": 0, "feedback": "La contribución es precio menos costo variable."}, {"q": "Costos fijos 800 y contribución 8 dan un equilibrio de…", "options": ["10 unidades", "100 unidades", "6.400 unidades", "800 unidades"], "answer": 1, "feedback": "Se dividen costos fijos entre contribución unitaria."}, {"q": "Con 150 unidades y contribución 8, menos 800 fijos, resulta…", "options": ["1.200 dólares de utilidad final garantizada", "800 dólares", "400 dólares", "3.000 dólares de resultado operativo"], "answer": 2, "feedback": "150 por ocho menos ochocientos equivale a cuatrocientos bajo los supuestos del ejemplo."}, {"q": "Si la contribución baja a 6, ¿cuántas unidades enteras cubren 800 fijos?", "options": ["133", "100", "80", "134"], "answer": 3, "feedback": "800 entre seis es 133,33; se redondea hacia arriba para cubrir el costo."}, {"q": "¿Qué distingue al valor presente?", "options": ["Considera el momento de los flujos mediante descuento", "Suma ventas sin costos", "Ignora el horizonte", "Garantiza los resultados futuros"], "answer": 0, "feedback": "El descuento relaciona flujos futuros con una tasa y un momento de valoración."}, {"q": "¿Qué debe reconocerse en una proyección?", "options": ["Que ya ocurrió la venta futura", "Supuestos e incertidumbre", "Que la publicidad siempre tendrá costo cero", "Que todos los clientes pagarán de inmediato"], "answer": 1, "feedback": "Una proyección no constituye un resultado realizado."}, {"q": "¿Qué limitación tiene el equilibrio simple de un producto?", "options": ["Incluye automáticamente cualquier mezcla de productos", "Elimina costos fijos", "Supone precio y costo unitarios constantes en el rango analizado", "Mide todos los riesgos de caja"], "answer": 2, "feedback": "Los supuestos delimitan la utilidad de la fórmula."}, {"q": "¿Por qué ventas y caja no son iguales?", "options": ["Porque toda venta es una inversión", "Porque no existen pagos diferidos", "Porque la caja no registra cobros", "Porque cobros y pagos pueden ocurrir en momentos distintos"], "answer": 3, "feedback": "El momento del movimiento de efectivo puede diferir del registro de ventas."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
