<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Internacionalización de los negocios electrónicos</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 4.1</small><h1>Internacionalización de los negocios electrónicos</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué implica internacionalizar una oferta digital?", "options": ["Adaptar propuesta y operación al mercado destino", "Solo traducir el encabezado", "Abrir anuncios sin revisar entregas", "Suponer idénticas reglas en todos los países"], "answer": 0, "feedback": "La operación y los requisitos cambian entre mercados."}, {"q": "¿Qué es localización de la experiencia?", "options": ["Convertir moneda sin revisar costos", "Adaptar lenguaje, formatos y condiciones al público destino", "Copiar literalmente toda comunicación", "Eliminar información de soporte"], "answer": 1, "feedback": "La adaptación abarca comprensión y expectativas."}, {"q": "40 menos 18, 12 y 3 da…", "options": ["7 dólares de utilidad final garantizada", "13 dólares netos finales", "7 dólares antes de costos excluidos", "73 dólares"], "answer": 2, "feedback": "La cifra no incluye publicidad, impuestos u otras partidas no especificadas."}, {"q": "¿De qué dependen requisitos aduaneros o sanitarios?", "options": ["Solo del idioma de la web", "Del número de seguidores", "Del color del embalaje", "Del producto y de los países involucrados"], "answer": 3, "feedback": "Se necesita revisar la combinación concreta de producto, origen y destino."}, {"q": "¿Qué debe aclararse al comprador?", "options": ["Costo total y responsabilidades relevantes", "Solo el precio sin condiciones", "Una entrega garantizada sin capacidad", "Que cualquier incidencia será ignorada"], "answer": 0, "feedback": "La información debe permitir comprender el compromiso transfronterizo."}, {"q": "¿Qué justifica un piloto limitado?", "options": ["Evitar toda comprobación oficial", "Aprender sobre margen y cumplimiento antes de ampliar", "Declarar éxito con visitas", "Eliminar la atención posterior"], "answer": 1, "feedback": "Un piloto contrasta la viabilidad con evidencia operacional."}, {"q": "¿Qué resultado no demuestra por sí solo rentabilidad?", "options": ["Margen neto delimitado y comprobado", "Costos contrastados", "Más visitas internacionales", "Cumplimiento de entregas medido"], "answer": 2, "feedback": "El alcance no indica cuánto valor económico queda ni si puede atenderse."}, {"q": "¿Qué riesgo financiero merece consideración?", "options": ["La garantía de un margen constante", "La ausencia de devoluciones por definición", "Un impuesto universal fijo inventado", "Variación del tipo de cambio y comisiones"], "answer": 3, "feedback": "El margen puede variar por condiciones financieras y operativas."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
