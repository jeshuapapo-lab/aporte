<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Sistemas de pago y documentos electrónicos</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 3.4</small><h1>Sistemas de pago y documentos electrónicos</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué prueba una pantalla de éxito del navegador?", "options": ["Solo una indicación que debe contrastarse con el estado confiable", "Que los fondos ya fueron conciliados", "Que la factura está autorizada", "Que nunca habrá devolución"], "answer": 0, "feedback": "La interfaz no sustituye la evidencia del estado de pago."}, {"q": "¿Qué compara la conciliación?", "options": ["Solo colores del recibo", "Registros de pedidos, pagos y liquidaciones relacionados", "Únicamente visitas del sitio", "La cantidad de anuncios publicados"], "answer": 1, "feedback": "Busca coherencia y explicación de diferencias financieras."}, {"q": "Un bruto de 50 y comisión de 2 producen neto de…", "options": ["52 dólares", "50 dólares netos", "48 dólares", "2 dólares de venta"], "answer": 2, "feedback": "La diferencia debe explicarse y registrarse, no confundirse con rechazo."}, {"q": "¿Qué debe evitar un aviso duplicado del proveedor?", "options": ["El registro del identificador", "La comprobación del origen", "La trazabilidad del pedido", "Una segunda confirmación o cargo de la misma operación"], "answer": 3, "feedback": "Los reintentos requieren tratamiento idempotente de la misma operación."}, {"q": "¿Qué diferencia una factura electrónica válida de un PDF cualquiera?", "options": ["El cumplimiento del esquema y requisitos aplicables", "El tamaño del logotipo", "Un fondo de color azul", "El nombre del archivo por sí solo"], "answer": 0, "feedback": "La validez no se deriva de la apariencia del documento."}, {"q": "¿Dónde deben consultarse requisitos tributarios ecuatorianos vigentes?", "options": ["Solo en una plantilla extranjera", "En la documentación oficial del SRI y asesoramiento competente", "En un anuncio de redes sin fuente", "En el diseño visual de otra tienda"], "answer": 1, "feedback": "Los requisitos deben comprobarse en fuentes oficiales aplicables."}, {"q": "¿Qué favorece minimizar exposición de datos de pago?", "options": ["Guardar todos los datos por conveniencia", "Compartir información sensible en correos", "Mecanismos adecuados del proveedor, como tokenización cuando corresponda", "Eliminar controles de acceso"], "answer": 2, "feedback": "La minimización reduce exposición sin eliminar las obligaciones propias."}, {"q": "¿Qué debe ocurrir con un pago rechazado?", "options": ["Despachar siempre el pedido como pagado", "Emitir éxito porque el navegador lo mostró", "Borrar toda evidencia de la operación", "Conservar el estado correcto y evitar tratarlo como cobrado"], "answer": 3, "feedback": "El estado operativo debe reflejar la evidencia auténtica del pago."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
