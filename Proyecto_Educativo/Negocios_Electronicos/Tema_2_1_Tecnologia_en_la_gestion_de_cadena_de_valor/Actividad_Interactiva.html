<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Tecnología en la gestión de cadena de valor</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 2.1</small><h1>Tecnología en la gestión de cadena de valor</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Cuándo aporta valor una tecnología?", "options": ["Cuando mejora una capacidad relevante con costos y riesgos considerados", "Siempre que reemplace papel por pantallas", "Solo cuando sea la más costosa", "Al aumentar datos sin uso definido"], "answer": 0, "feedback": "La contribución depende del resultado para la actividad y el cliente."}, {"q": "¿Qué requisito favorece integrar pedidos e inventario?", "options": ["Duplicar cada producto en cada sistema", "Identificadores y reglas de actualización comunes", "Actualizar solo el diseño visual", "Eliminar a los responsables del dato"], "answer": 1, "feedback": "Las aplicaciones necesitan referirse de forma coherente a los mismos objetos."}, {"q": "¿Qué es una línea base?", "options": ["La meta anunciada después de instalar", "El precio de la licencia", "El resultado medido antes de la intervención", "Una opinión sin datos"], "answer": 2, "feedback": "La línea base permite comparar resultados con condiciones definidas."}, {"q": "¿Qué riesgo produce acelerar pedidos sin revisar producción?", "options": ["Eliminar todas las restricciones", "Garantizar entregas más rápidas", "Aumentar automáticamente la capacidad", "Trasladar el cuello de botella a otra etapa"], "answer": 3, "feedback": "Una mejora local puede empeorar el desempeño global."}, {"q": "Seis pedidos incumplidos de cien confirmados representan…", "options": ["6 %", "0,6 %", "60 %", "16 %"], "answer": 0, "feedback": "Se calcula seis dividido para cien y multiplicado por cien."}, {"q": "¿Qué debe acompañar el costo de la licencia?", "options": ["Únicamente la fotografía del proveedor", "Integración, aprendizaje y mantenimiento", "Solo el ahorro ideal anunciado", "La eliminación del soporte"], "answer": 1, "feedback": "El costo de una intervención incluye más que la compra inicial."}, {"q": "¿Qué muestra una pantalla con existencias desactualizadas?", "options": ["Una reserva de inventario garantizada", "Una certificación de exactitud", "Un riesgo para la coordinación", "Una venta conciliada"], "answer": 2, "feedback": "Compartir información no garantiza que sea correcta o vigente."}, {"q": "¿Qué conviene revisar si baja el tiempo pero suben reclamos?", "options": ["Solo el indicador que mejoró", "La eliminación del registro de reclamos", "Una declaración automática de éxito", "El efecto global y posibles consecuencias ocultas"], "answer": 3, "feedback": "El valor debe evaluarse con medidas relacionadas y no con una cifra aislada."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
