<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Metodología CRM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 2.2</small><h1>Metodología CRM</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué describe mejor CRM?", "options": ["Una metodología apoyada por procesos, datos y tecnología", "Una lista de correos sin responsables", "Solo una licencia de software", "Una campaña idéntica para todo contacto"], "answer": 0, "feedback": "La metodología organiza la relación; el software por sí solo no la define."}, {"q": "¿Qué debe quedar en una oportunidad activa?", "options": ["Solo el color del estado", "Responsable, próxima acción y fecha pertinente", "Una fecha de cierre garantizada sin evidencia", "El mismo mensaje para todos los casos"], "answer": 1, "feedback": "El seguimiento requiere continuidad y responsabilidad."}, {"q": "Dos cierres entre ocho oportunidades calificadas equivalen a…", "options": ["20 %", "40 %", "25 %", "4 %"], "answer": 2, "feedback": "El denominador debe ser el grupo definido: ocho oportunidades."}, {"q": "¿Por qué no deben mezclarse consultas y ventas cerradas?", "options": ["Porque las consultas siempre valen cero", "Porque toda consulta garantiza un ingreso", "Porque los clientes no pueden cambiar de estado", "Porque representan estados y compromisos diferentes"], "answer": 3, "feedback": "Confundir estados distorsiona seguimiento y resultados."}, {"q": "¿Qué ayuda a evitar propuestas duplicadas?", "options": ["Registro compartido e identificación de la oportunidad", "Archivos privados sin coordinación", "Tres identificadores para la misma consulta", "Eliminar el historial de propuestas"], "answer": 0, "feedback": "La coordinación necesita una visión consistente del caso."}, {"q": "¿Qué riesgo tiene una automatización sin contexto?", "options": ["Garantizar atención personalizada", "Enviar comunicaciones repetidas o contrarias a preferencias", "Eliminar toda información incorrecta", "Resolver automáticamente cualquier reclamo"], "answer": 1, "feedback": "La automatización debe responder a reglas y necesidades reales."}, {"q": "¿Qué debe explicarse al recopilar datos?", "options": ["Que podrán usarse para cualquier fin futuro", "Que no existen responsables", "Su finalidad y el uso pertinente", "Que no podrán corregirse"], "answer": 2, "feedback": "La relación requiere un tratamiento responsable de la información."}, {"q": "¿Qué puede sesgar una tasa de cierre?", "options": ["Definir claramente el período", "Conservar los casos que no cerraron", "Usar una población explícita", "Registrar solo oportunidades fáciles"], "answer": 3, "feedback": "La selección del registro puede ocultar parte del trabajo y alterar la interpretación."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
