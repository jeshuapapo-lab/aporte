<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Las páginas de inicio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 1.1</small><h1>Las páginas de inicio</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="10" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Cuál es la función principal de una página de inicio?", "options": ["Orientar sobre la oferta y facilitar recorridos relevantes", "Mostrar todo el catálogo completo en la primera pantalla", "Sustituir todas las páginas del sitio", "Garantizar una compra en cada visita"], "answer": 0, "feedback": "La página principal presenta la oferta y organiza accesos; no garantiza compras ni sustituye el resto del sitio."}, {"q": "¿Qué afirmación sobre la llegada al sitio es correcta?", "options": ["Todas las visitas comienzan en el inicio", "Una búsqueda puede llevar directamente a un producto", "Solo se puede entrar desde un anuncio", "La página de inicio impide accesos directos"], "answer": 1, "feedback": "El inicio es una puerta de entrada, pero productos y otras páginas también reciben visitas directas."}, {"q": "En el caso ficticio Minga Cacao, ¿qué mensaje explica mejor la oferta?", "options": ["Bienvenidos a nuestra web", "La excelencia que mereces", "Chocolate de cacao ecuatoriano para regalar", "Tu mejor experiencia está aquí"], "answer": 2, "feedback": "El mensaje específico identifica qué se ofrece y una intención del público, sin promesas no verificadas."}, {"q": "¿Qué texto anticipa mejor el destino de un botón que abre la selección de regalos?", "options": ["Haz clic aquí", "Más", "Continuar ahora", "Explorar regalos"], "answer": 3, "feedback": "Una etiqueta descriptiva ayuda a prever la acción antes de activarla."}, {"q": "¿Qué decisión mejora la jerarquía de una página con seis botones iguales?", "options": ["Destacar una acción prioritaria y ordenar las secundarias", "Cambiar todos los botones al mismo color brillante", "Eliminar toda navegación", "Añadir seis botones nuevos"], "answer": 0, "feedback": "Priorizar ordena la atención sin impedir que existan otros recorridos pertinentes."}, {"q": "¿Qué comprobación aporta evidencia sobre el acceso con teclado?", "options": ["Contar cuántos colores tiene el sitio", "Recorrer los controles y comprobar orden y foco visible", "Ampliar la foto principal", "Medir solamente las visitas"], "answer": 1, "feedback": "El orden de navegación y el foco visible permiten identificar y utilizar los controles sin ratón."}, {"q": "Según WCAG 2.2, ¿cuál es el contraste mínimo general del texto normal en el criterio 1.4.3, sujeto a sus excepciones?", "options": ["1:1", "2:1", "4,5:1", "10:1 en todos los casos"], "answer": 2, "feedback": "El umbral para texto normal es 4,5:1; para texto grande es 3:1. El criterio contiene excepciones."}, {"q": "Con 50 sesiones que completan la acción de 2.000 que vieron el inicio, ¿qué proporción resulta?", "options": ["25 %", "40 %", "0,25 %", "2,5 %"], "answer": 3, "feedback": "Se calcula 50 dividido para 2.000, multiplicado por 100. Son datos hipotéticos."}, {"q": "¿Qué conclusión es válida si aumentan los clics en un botón?", "options": ["Hay más clics observados; todavía hay que comprobar el resultado del negocio", "Todas las personas compraron", "El diseño es la única causa posible", "La accesibilidad ya está garantizada"], "answer": 0, "feedback": "Un clic es una acción intermedia. No demuestra una venta, una causa única ni accesibilidad."}, {"q": "¿Qué debe acompañar una promesa de entrega o certificación?", "options": ["Una animación llamativa", "Evidencia verificable de que el negocio puede respaldarla", "Un botón de color rojo", "La frase calidad garantizada sin más información"], "answer": 1, "feedback": "Las señales de confianza deben poder demostrarse y no basarse en afirmaciones engañosas."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=8?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
