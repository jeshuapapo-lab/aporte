<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Aplicaciones para negocios móviles</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 4.2</small><h1>Aplicaciones para negocios móviles</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe orientar una solución móvil?", "options": ["La tarea y el contexto de uso", "La instalación como único objetivo", "Copiar todas las pantallas de escritorio", "Pedir permisos antes de conocer su finalidad"], "answer": 0, "feedback": "La solución responde a una necesidad en condiciones móviles reales."}, {"q": "¿Qué puede resolver una web adaptable?", "options": ["Todas las capacidades nativas en cualquier plataforma", "Recorridos útiles sin exigir instalación", "La ausencia garantizada de conexión", "La eliminación de todo mantenimiento"], "answer": 1, "feedback": "La elección depende de las funciones requeridas y sus límites."}, {"q": "¿Cuándo conviene pedir un permiso?", "options": ["Siempre al abrir por primera vez", "Para almacenar datos sin uso definido", "Cuando la función lo necesita y con finalidad explicada", "Aunque la función pueda resolverse sin él"], "answer": 2, "feedback": "Los permisos deben ser proporcionales a la necesidad."}, {"q": "¿Qué debe pasar si se rechaza un permiso no esencial?", "options": ["Impedir siempre explorar el catálogo", "Dar por aceptado el permiso", "Recopilar el dato por otro medio oculto", "Ofrecer una alternativa razonable para la tarea"], "answer": 3, "feedback": "El recorrido debe contemplar decisiones del usuario."}, {"q": "¿Qué riesgo produce una confirmación ambigua tras una caída?", "options": ["Que el usuario repita y duplique una operación", "Que todos los pagos se concilien solos", "Que la conexión mejore automáticamente", "Que nunca exista abandono"], "answer": 0, "feedback": "El estado debe ser claro y el reintento controlado."}, {"q": "¿Qué conviene evitar en notificaciones?", "options": ["Mensajes comprensibles de estado", "Exponer datos sensibles innecesarios", "Preferencias configurables", "Información pertinente sin datos sensibles"], "answer": 1, "feedback": "La pantalla del dispositivo puede ser vista por otras personas."}, {"q": "¿Qué necesita una función sin conexión?", "options": ["Suponer que todo estará actualizado", "Eliminar la resolución de conflictos", "Reglas sobre datos disponibles y sincronización", "Confirmar pagos sin evidencia"], "answer": 2, "feedback": "La capacidad offline necesita un diseño operacional explícito."}, {"q": "¿Qué indicador se acerca a la utilidad de la solución?", "options": ["Solo cantidad de instalaciones", "El número de pantallas creadas", "Los permisos solicitados sin uso", "Tareas completadas con condiciones definidas"], "answer": 3, "feedback": "La utilidad se demuestra en tareas y resultados, no en presencia de una aplicación."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
