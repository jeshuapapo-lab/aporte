<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · División por departamentos y categorías</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 1.2</small><h1>División por departamentos y categorías</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué criterio debe orientar la clasificación del catálogo?", "options": ["Las tareas y el vocabulario del público", "La jerarquía de cargos internos", "El orden en que se cargaron los productos", "El código contable como única etiqueta"], "answer": 0, "feedback": "La navegación debe facilitar la búsqueda de las personas; los códigos internos pueden conservarse como datos de gestión."}, {"q": "¿Cuál es una faceta apropiada para tabletas de chocolate?", "options": ["La página institucional", "Porcentaje de cacao", "El proceso de contratación", "El nombre de la base de datos"], "answer": 1, "feedback": "Una faceta limita resultados por un atributo del producto."}, {"q": "¿Qué problema produce crear una categoría para cada combinación de precio y tamaño?", "options": ["La eliminación automática de filtros", "La unificación garantizada de fichas", "Una proliferación difícil de mantener y navegar", "Un aumento seguro de la disponibilidad"], "answer": 2, "feedback": "Las combinaciones se gestionan mejor como atributos y filtros cuando corresponda."}, {"q": "¿Qué evalúa una prueba de árbol?", "options": ["La velocidad de la pasarela de pagos", "El acabado visual de una fotografía", "La duración de una campaña publicitaria", "Si las etiquetas y su jerarquía permiten encontrar un contenido"], "answer": 3, "feedback": "Se comprueba la estructura de navegación sin depender de la presentación gráfica."}, {"q": "¿Qué técnica explora cómo agrupa y nombra productos el público?", "options": ["Ordenamiento de tarjetas", "Conciliación bancaria", "Prueba de carga del servidor", "Cálculo del valor presente"], "answer": 0, "feedback": "El agrupamiento de tarjetas aporta ideas para la taxonomía y su vocabulario."}, {"q": "Un artículo aparece en dos rutas. ¿Cómo debe gestionarse?", "options": ["Duplicando el inventario de cada ruta", "Con identidad y ficha consistentes", "Creando precios distintos sin explicación", "Eliminando su identificador original"], "answer": 1, "feedback": "Varios accesos no deben producir registros contradictorios del mismo artículo."}, {"q": "¿Qué etiqueta merece revisión por ser poco informativa?", "options": ["Bombones", "Tabletas", "Varios", "Cajas para regalo"], "answer": 2, "feedback": "Varios no anticipa con claridad qué encontrará una persona."}, {"q": "¿Qué debe revisarse al cambiar categorías publicadas?", "options": ["Solo el color del encabezado", "Únicamente el salario del editor", "La eliminación de toda búsqueda", "Enlaces, accesos y productos afectados"], "answer": 3, "feedback": "Los cambios de clasificación pueden romper recorridos o dejar artículos difíciles de localizar."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
