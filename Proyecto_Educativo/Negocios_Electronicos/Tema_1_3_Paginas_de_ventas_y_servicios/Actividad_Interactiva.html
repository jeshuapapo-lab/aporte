<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Páginas de ventas y servicios</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15;font-size:clamp(1.55rem,5vw,2rem);overflow-wrap:anywhere}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 1.3</small><h1>Páginas de ventas y servicios</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué información es esencial para evaluar un servicio?", "options": ["Alcance y exclusiones", "Únicamente una imagen decorativa", "Solo el número de seguidores", "Una garantía ilimitada de éxito"], "answer": 0, "feedback": "El alcance y las exclusiones delimitan lo que se contrata."}, {"q": "¿Qué acción encaja con una oferta cuyo precio depende de personalización?", "options": ["Confirmar pago sin importe", "Solicitar cotización", "Comprar una variante desconocida", "Aceptar cargos aún no definidos"], "answer": 1, "feedback": "La cotización permite aclarar las condiciones antes del compromiso."}, {"q": "¿Qué debe acompañar la foto de un producto?", "options": ["Reseñas inventadas", "Escasez no comprobada", "Características y condiciones verificables", "Una promesa que contradice el inventario"], "answer": 2, "feedback": "La fotografía no reemplaza información necesaria para decidir."}, {"q": "¿Qué decisión mejora la transparencia?", "options": ["Añadir un cargo después de cobrar", "Ocultar exclusiones en una imagen", "Mostrar urgencia ficticia", "Informar costos relevantes antes del compromiso"], "answer": 3, "feedback": "Los costos y las condiciones deben conocerse oportunamente."}, {"q": "¿Qué debe conservarse al pasar al carrito?", "options": ["La variante, el precio y la disponibilidad elegidos", "Solo el color de fondo", "Un precio distinto sin aviso", "Una selección diferente de productos"], "answer": 0, "feedback": "La continuidad evita discrepancias entre la oferta y la contratación."}, {"q": "¿Qué demuestra un clic en comprar?", "options": ["Que el pago fue conciliado", "Que se inició una acción, no necesariamente una venta cobrada", "Que el pedido fue entregado", "Que no hubo abandono"], "answer": 1, "feedback": "El clic es una señal intermedia dentro de un recorrido mayor."}, {"q": "¿Qué debe indicar la confirmación de una solicitud?", "options": ["Que el servicio ya se ejecutó", "Que existe un pago inexistente", "Qué se recibió y cuál es el siguiente paso", "Que no habrá comunicación posterior"], "answer": 2, "feedback": "La confirmación informa estado y expectativas sin inventar operaciones."}, {"q": "¿Qué práctica debe evitarse?", "options": ["Precisar cantidades mínimas reales", "Explicar variantes disponibles", "Informar exclusiones del servicio", "Inventar opiniones para aparentar confianza"], "answer": 3, "feedback": "La confianza requiere evidencia auténtica y condiciones comprensibles."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
