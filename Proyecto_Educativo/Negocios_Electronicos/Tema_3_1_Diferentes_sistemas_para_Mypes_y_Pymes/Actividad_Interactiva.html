<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Diferentes sistemas para Mypes y Pymes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 3.1</small><h1>Diferentes sistemas para Mypes y Pymes</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe hacerse antes de comparar marcas?", "options": ["Definir procesos y requisitos prioritarios", "Contar anuncios del proveedor", "Elegir el mayor número de módulos", "Comprar licencias para todos sin prueba"], "answer": 0, "feedback": "La selección parte de necesidades y capacidad de operación."}, {"q": "¿Qué sistema suele integrar funciones empresariales?", "options": ["Una fotografía de catálogo", "ERP", "Un editor de logotipos", "Un navegador sin aplicaciones"], "answer": 1, "feedback": "ERP agrupa e integra funciones, aunque sus capacidades deben comprobarse."}, {"q": "¿Qué forma parte del costo total?", "options": ["Solo el pago inicial", "Únicamente el precio de una pantalla", "Migración, capacitación y soporte además de licencias", "Solo el descuento comercial"], "answer": 2, "feedback": "La implantación y operación generan costos que no siempre están en la licencia."}, {"q": "¿Qué riesgo debe evaluarse en una operación en la nube?", "options": ["Ausencia garantizada de fallos", "Eliminación automática de permisos", "Imposibilidad de exportar cualquier dato por definición", "Dependencia de conectividad y del servicio"], "answer": 3, "feedback": "La arquitectura requiere revisar disponibilidad, acceso y continuidad."}, {"q": "¿Qué prueba responde al problema del caso?", "options": ["Pedido, venta local y cancelación sobre el mismo inventario", "Cambiar el logotipo", "Abrir solo la página de inicio", "Contar módulos sin usarlos"], "answer": 0, "feedback": "La prueba debe demostrar sincronización y reserva en situaciones representativas."}, {"q": "¿Qué es un criterio de aceptación?", "options": ["Una preferencia que no puede medirse", "Una condición observable para aprobar el resultado", "El nombre del vendedor", "Una promesa sin procedimiento de prueba"], "answer": 1, "feedback": "Permite decidir si la función satisface lo requerido."}, {"q": "¿Qué ventaja aporta una implantación gradual?", "options": ["Evita cualquier necesidad de capacitación", "Garantiza que nunca haya fallos", "Permite aprender y controlar riesgos antes de ampliar", "Elimina los requisitos iniciales"], "answer": 2, "feedback": "El despliegue por etapas permite comprobar y ajustar."}, {"q": "¿Por qué revisar exportación de datos?", "options": ["Para publicar información de clientes", "Para duplicar ventas artificialmente", "Para suprimir controles de acceso", "Para conservar posibilidades de recuperación y cambio de proveedor"], "answer": 3, "feedback": "La portabilidad ayuda a gestionar dependencia y continuidad."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
