<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica · Integraciones rentables de software y hardware</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#18394a;font:18px/1.6 system-ui,sans-serif}main{max-width:860px;margin:3rem auto;padding:1.8rem;background:white;border-radius:20px;border-top:8px solid #087e8b}h1{line-height:1.15}small{color:#536975}button{font:inherit;cursor:pointer}#opciones button{display:block;width:100%;text-align:left;margin:12px 0;padding:16px;border:2px solid #bccdcc;border-radius:12px;background:#fff;color:#18394a}button:focus-visible{outline:4px solid #b9432e;outline-offset:3px}#opciones button:disabled{cursor:default;opacity:1}#siguiente,#reiniciar{padding:12px 24px;background:#087e8b;color:white;border:0;border-radius:10px;margin-top:16px}#respuesta{padding:16px;border-radius:10px}progress{width:100%;accent-color:#087e8b}a{color:#087e8b}@media(max-width:600px){main{margin:0;padding:1.2rem}}</style>
<main><small>NEGOCIOS ELECTRÓNICOS · TEMA 3.3</small><h1>Integraciones rentables de software y hardware</h1><p>Elige una respuesta por pregunta. Revisa la explicación y continúa. Sin límite de tiempo.</p><p><small>Práctica local independiente. No publicada en Educaplay. No recopila datos ni usa servicios externos.</small></p><progress id="progreso" value="0" max="8" aria-label="Preguntas completadas"></progress><p id="contador"></p><h2 id="pregunta" tabindex="-1"></h2><div id="opciones"></div><div id="respuesta" role="status" aria-live="polite"></div><button id="siguiente" hidden>Siguiente pregunta</button><button id="reiniciar" hidden>Volver a practicar</button><noscript>Activa JavaScript para practicar. El banco completo también está disponible en Actividad_Educaplay.txt.</noscript></main>
<script>const preguntas=[{"q": "¿Qué debe validarse después de leer un código?", "options": ["Que identifica un producto válido y una operación permitida", "Solo que sonó el lector", "Que la pantalla cambió de color", "Que el proveedor es conocido"], "answer": 0, "feedback": "La captura no equivale a validar la transacción."}, {"q": "¿Qué evita registrar dos veces un reintento de la misma operación?", "options": ["Repetir siempre la venta", "Un mecanismo de identificación y registro único", "Eliminar toda trazabilidad", "Asignar un código nuevo a cada petición sin relación"], "answer": 1, "feedback": "La operación debe reconocerse aunque la comunicación se repita."}, {"q": "Ahorro bruto 180 menos costo recurrente 60 da…", "options": ["240 dólares", "180 dólares netos", "120 dólares netos mensuales", "60 dólares de inversión"], "answer": 2, "feedback": "El beneficio neto descuenta el costo adicional de operación."}, {"q": "Inversión 1.200 y ahorro neto mensual 120 dan recuperación simple de…", "options": ["12 meses", "1 mes", "120 meses", "10 meses"], "answer": 3, "feedback": "Se divide la inversión entre el ahorro neto por período."}, {"q": "¿Qué limitación tiene esa recuperación simple?", "options": ["No descuenta el momento de los flujos ni cubre todos los riesgos", "Garantiza el ahorro real", "Incluye cualquier fallo posible", "Sustituye el análisis de volumen"], "answer": 0, "feedback": "Es una referencia simplificada, no una evaluación completa."}, {"q": "¿Qué debe probar un piloto de integración?", "options": ["Solo el encendido del dispositivo", "Casos normales y fallos representativos", "Únicamente una lectura correcta", "La interfaz sin registrar operaciones"], "answer": 1, "feedback": "Los errores revelan problemas que una prueba ideal no detecta."}, {"q": "¿Qué necesita una operación sin conexión?", "options": ["Suponer que no habrá duplicados", "Eliminar identificadores", "Reglas de sincronización y resolución de conflictos", "Ignorar operaciones locales al reconectar"], "answer": 2, "feedback": "Guardar datos no resuelve por sí solo cómo combinarlos después."}, {"q": "¿Qué costo suele olvidarse al comparar dispositivos?", "options": ["Únicamente el precio de compra", "El texto de la caja", "La fecha del anuncio", "Reposición y soporte"], "answer": 3, "feedback": "La continuidad económica requiere considerar operación y mantenimiento."}];let indice=0,puntos=0,bloqueado=false;const $=id=>document.getElementById(id);
function mostrar(){bloqueado=false;$('contador').textContent=`Pregunta ${indice+1} de ${preguntas.length}`;$('pregunta').textContent=preguntas[indice].q;$('opciones').replaceChildren();$('respuesta').textContent='';$('respuesta').style.background='transparent';$('siguiente').hidden=true;preguntas[indice].options.forEach((texto,i)=>{const b=document.createElement('button');b.textContent=texto;b.onclick=()=>responder(i);$('opciones').append(b)});}
function responder(i){if(bloqueado)return;bloqueado=true;const q=preguntas[indice],bien=i===q.answer;if(bien)puntos++;[...$('opciones').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer){b.style.borderColor='#087e8b';b.textContent+=' ✓ Respuesta correcta'}else if(j===i)b.textContent+=' — Tu elección'});$('respuesta').style.background=bien?'#e2f0ee':'#fff0e8';$('respuesta').textContent=(bien?'Correcto. ':'Revisa la respuesta. ')+q.feedback;$('progreso').value=indice+1;$('siguiente').hidden=false;$('siguiente').textContent=indice===preguntas.length-1?'Ver resultado':'Siguiente pregunta';}
$('siguiente').onclick=()=>{indice++;if(indice<preguntas.length){mostrar();$('pregunta').focus()}else{$('contador').textContent='Práctica completada';$('pregunta').textContent=`Resultado: ${puntos} de ${preguntas.length}`;$('opciones').replaceChildren();$('respuesta').textContent=puntos>=6?'Has alcanzado la referencia de práctica. Revisa también cómo aplicarías los criterios.':'Vuelve a la presentación y revisa las explicaciones antes de repetir.';$('siguiente').hidden=true;$('reiniciar').hidden=false;$('pregunta').focus()}};
$('reiniciar').onclick=()=>{indice=0;puntos=0;$('progreso').value=0;$('reiniciar').hidden=true;mostrar();$('pregunta').focus()};mostrar();</script></html>
